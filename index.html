<script>
const lessons=[
["Números","01 • Números inteiros e reta numérica","Compreender positivos, negativos, opostos, comparação e ordenação.","EF07MA03",`<p>Os números inteiros incluem negativos, zero e positivos: … −3, −2, −1, 0, 1, 2, 3 …</p><p>Na reta numérica, quanto mais à direita, maior o número. O <b>oposto</b> de +5 é −5 e o módulo (valor absoluto) de −5 é 5.</p><div class="formula">−7 &lt; −3 &lt; 0 &lt; 4 &lt; 9<br>|−8| = 8</div><div class="tip">Entre números negativos, o que está mais perto do zero é o maior.</div>`],
["Números","02 • Adição e subtração de inteiros","Calcular e interpretar operações com números positivos e negativos.","EF07MA03",`<p>Somar inteiros pode ser entendido como deslocamento na reta numérica.</p><div class="formula">(+7)+(−10)=−3<br>(−4)+(−6)=−10<br>8−(−3)=8+3=11</div><p>Subtrair um número equivale a somar seu oposto.</p>`],
["Números","03 • Multiplicação e divisão de inteiros","Aplicar regras de sinais e resolver problemas.","EF07MA03",`<p>Na multiplicação e divisão, sinais iguais produzem resultado positivo; sinais diferentes produzem resultado negativo.</p><div class="formula">(−6)×(−4)=+24<br>(−24)÷(+6)=−4</div><div class="tip">Primeiro determine o sinal; depois calcule os valores absolutos.</div>`],
["Números","04 • Expressões com números inteiros","Resolver expressões respeitando a ordem das operações.","EF07MA04",`<p>Use parênteses, depois potências, multiplicações/divisões e adições/subtrações.</p><div class="formula">−3 + 2×(−5) = −3 −10 = −13</div><p>Não esqueça: −(−a)=+a.</p>`],
["Números","05 • Frações, equivalência e simplificação","Simplificar frações e reconhecer diferentes representações.","EF07MA01",`<p>Uma fração pode ser simplificada dividindo numerador e denominador pelo mesmo divisor.</p><div class="formula">18/24 = 3/4</div><p>Para comparar frações, procure denominador comum ou use produtos cruzados.</p>`],
["Números","06 • Operações com frações","Somar, subtrair, multiplicar e dividir frações.","EF07MA01",`<div class="formula">1/3+1/6=1/2<br>2/5×3/4=6/20=3/10<br>2/3÷5/6=2/3×6/5=4/5</div><p>Dividir por uma fração significa multiplicar pelo seu inverso.</p>`],
["Números","07 • Números racionais","Representar e operar números racionais em diferentes formas.","EF07MA02",`<p>Números racionais podem ser escritos como fração, decimal finito ou decimal periódico.</p><div class="formula">1/2 = 0,5<br>3/4 = 0,75<br>1/3 = 0,333…</div><p>Incluem números negativos, como −2/5 e −1,7.</p>`],
["Números","08 • Razão, proporção e proporcionalidade","Resolver situações de proporcionalidade direta e compreender escalas.","EF07MA17 • EF07MA18",`<p>Uma proporção expressa equivalência entre razões.</p><div class="formula">2/3 = 8/12</div><p>Se 3 cadernos custam R$24, então 1 custa R$8 e 5 custam R$40.</p><div class="tip">Antes de usar uma técnica, pergunte: as grandezas aumentam ou diminuem na mesma proporção?</div>`],
["Números","09 • Porcentagem e acréscimos","Calcular porcentagens, aumentos e reduções.","EF07MA02 • EF07MA06",`<p>Porcentagem pode ser convertida para decimal ou fração.</p><div class="formula">20% = 0,20 = 1/5<br>R$150 com 20% de desconto → 150−30 = R$120</div><p>Um aumento de 10% multiplica o valor por 1,10; uma redução de 10%, por 0,90.</p>`],
["Números","10 • Juros e educação financeira","Interpretar situações simples de juros, descontos e planejamento.","EF07MA02 • EF07MA06",`<p>Em situações simples de juros, o valor dos juros pode ser calculado como taxa × capital × tempo, quando o modelo for de juros simples.</p><div class="formula">J = C×i×t<br>M = C+J</div><div class="example">C=R$500, i=2% ao mês, t=3 meses → J=500×0,02×3=R$30.</div>`],
["Álgebra","11 • Linguagem algébrica","Representar padrões e relações usando letras.","EF07MA13",`<p>Letras representam números que podem variar ou ser desconhecidos.</p><div class="formula">“o dobro de x mais 3” → 2x+3<br>“um número menos 7” → x−7</div><p>Uma expressão algébrica não precisa ter resultado numérico único enquanto a variável não for definida.</p>`],
["Álgebra","12 • Valor numérico de expressões","Substituir valores em expressões algébricas.","EF07MA13",`<p>Substitua a variável e respeite a ordem das operações.</p><div class="example">Para x=4: 3x+2 = 3(4)+2 = <b>14</b>.</div><div class="formula">x²−2x+1, com x=5 → 25−10+1=16</div>`],
["Álgebra","13 • Equações do 1º grau","Resolver equações com uma incógnita.","EF07MA18 • EF07MA19",`<p>Uma equação é uma igualdade que contém uma incógnita. O objetivo é encontrar o valor que torna a igualdade verdadeira.</p><div class="formula">3x+5=20<br>3x=15<br>x=5</div><div class="tip">Sempre confira substituindo o valor encontrado na equação original.</div>`],
["Álgebra","14 • Problemas com equações","Traduzir problemas cotidianos para equações.","EF07MA18 • EF07MA19",`<p>Defina a incógnita antes de montar a equação.</p><div class="example">“Um número somado a 12 resulta em 31.”<br>x+12=31 → <b>x=19</b>.</div><p>Depois interprete a resposta dentro do contexto do problema.</p>`],
["Álgebra","15 • Sequências e padrões","Identificar regularidades e expressar uma regra.","EF07MA14",`<p>Procure o que muda de um termo para o seguinte.</p><div class="example">3, 7, 11, 15… aumenta 4 a cada termo.</div><div class="formula">Termo geral: aₙ = 3 + (n−1)×4</div>`],
["Álgebra","16 • Razão entre grandezas","Relacionar grandezas e interpretar taxas.","EF07MA17",`<p>Razão é uma comparação por divisão. Exemplos: km/h, habitantes/km² e preço por unidade.</p><div class="example">120 km em 2 h → velocidade média = 60 km/h.</div>`],
["Álgebra","17 • Proporcionalidade direta","Modelar relações em que duas grandezas variam na mesma razão.","EF07MA17",`<p>Se uma grandeza dobra e a outra também dobra, há proporcionalidade direta, desde que a relação permaneça constante.</p><div class="formula">y = kx<br>Se y=15 quando x=3, k=5 → y=5x.</div>`],
["Álgebra","18 • Proporcionalidade inversa","Reconhecer situações em que uma grandeza aumenta enquanto a outra diminui proporcionalmente.","EF07MA17",`<p>Em um modelo de proporcionalidade inversa, o produto das grandezas permanece constante.</p><div class="formula">x×y=k</div><div class="example">Se 4 pessoas realizam um trabalho em 6 dias, no modelo ideal: 4×6=24 pessoa-dias; 8 pessoas → 3 dias.</div>`],
["Geometria","19 • Ângulos e relações","Calcular ângulos complementares, suplementares e em retas.","EF07MA23",`<p>Ângulos complementares somam 90°. Suplementares somam 180°. Ângulos opostos pelo vértice têm a mesma medida.</p><div class="formula">x+35°=90° → x=55°<br>x+120°=180° → x=60°</div>`],
["Geometria","20 • Triângulos: propriedades","Usar soma dos ângulos internos e propriedades dos lados.","EF07MA24",`<p>A soma dos ângulos internos de qualquer triângulo é 180°.</p><div class="formula">50°+60°+x=180° → x=70°</div><p>Em um triângulo isósceles, os ângulos da base são congruentes.</p>`],
["Geometria","21 • Triângulo e condição de existência","Verificar quando três medidas podem formar um triângulo.","EF07MA25",`<p>Para formar um triângulo, a soma de dois lados deve ser maior que o terceiro.</p><div class="example">3, 4 e 5 formam triângulo. 2, 3 e 6 não formam, pois 2+3 não é maior que 6.</div>`],
["Geometria","22 • Circunferência e círculo","Reconhecer raio, diâmetro, comprimento e área do círculo.","EF07MA27",`<p>O raio vai do centro à circunferência; o diâmetro mede dois raios.</p><div class="formula">d=2r<br>C=2πr<br>A=πr²</div><p>Use π≈3,14 quando solicitado.</p>`],
["Geometria","23 • Simetria e transformações","Identificar simetria, translação, rotação e reflexão.","EF07MA19 • EF07MA20",`<p>Reflexão produz uma imagem espelhada; rotação gira uma figura em torno de um ponto; translação desloca sem girar nem deformar.</p><div class="tip">Transformações que preservam forma e tamanho são isometrias.</div>`],
["Geometria","24 • Polígonos regulares","Calcular ângulos e reconhecer propriedades de polígonos.","EF07MA24 • EF07MA25",`<p>Polígono regular possui lados e ângulos internos congruentes.</p><div class="formula">Soma dos ângulos internos = (n−2)×180°</div><div class="example">Quadrilátero: (4−2)×180°=360°.</div>`],
["Geometria","25 • Circunferência e comprimento","Resolver problemas envolvendo perímetro circular e medidas.","EF07MA27",`<p>O comprimento da circunferência é proporcional ao raio.</p><div class="example">r=5 cm → C≈2×3,14×5=31,4 cm.</div><p>Observe se o problema pede raio, diâmetro, comprimento ou área.</p>`],
["Grandezas","26 • Área de figuras planas","Calcular áreas de triângulos, quadriláteros e outras figuras por decomposição.","EF07MA26",`<div class="formula">Retângulo: A=b×h<br>Triângulo: A=(b×h)/2<br>Paralelogramo: A=b×h</div><p>Figuras compostas podem ser divididas em figuras conhecidas.</p>`],
["Grandezas","27 • Perímetro, área e unidades","Diferenciar medidas de contorno e superfície.","EF07MA26",`<p>Perímetro é medido em unidades lineares (cm, m). Área é medida em unidades quadradas (cm², m²).</p><div class="tip">Não confunda 5 m com 5 m²: representam grandezas diferentes.</div>`],
["Grandezas","28 • Volume e capacidade","Calcular volume de blocos retangulares e relacionar volume e capacidade.","EF07MA26",`<p>Para um bloco retangular:</p><div class="formula">V = comprimento×largura×altura</div><div class="example">2×3×4=24 cm³.</div><p>Em situações apropriadas, 1 dm³ corresponde a 1 L.</p>`],
["Probabilidade e Estatística","29 • Média, moda e mediana","Calcular e interpretar medidas de tendência central.","EF07MA35",`<p><b>Média:</b> soma ÷ quantidade. <b>Moda:</b> valor mais frequente. <b>Mediana:</b> valor central após ordenar os dados.</p><div class="example">2, 3, 3, 5, 7 → média 4; moda 3; mediana 3.</div>`],
["Probabilidade e Estatística","30 • Gráficos e pesquisa","Analisar dados, amostras, tabelas e diferentes representações.","EF07MA36 • EF07MA37",`<p>Uma pesquisa precisa de pergunta clara, população ou amostra adequada, coleta organizada e representação coerente.</p><div class="tip">Um gráfico pode ser tecnicamente correto e ainda induzir interpretação errada se a escala for inadequada.</div>`],
["Probabilidade e Estatística","31 • Probabilidade experimental","Comparar probabilidades teóricas e resultados de experimentos.","EF07MA34",`<p>Frequência relativa é a razão entre ocorrências de um evento e o total de tentativas.</p><div class="formula">frequência relativa = ocorrências ÷ tentativas</div><p>Com muitas repetições, a frequência relativa tende a se aproximar da probabilidade teórica em experimentos aleatórios estáveis.</p>`],
["Probabilidade e Estatística","32 • Simulado final do 7º ano","Revisar números, álgebra, geometria, grandezas, estatística e probabilidade.","Revisão geral",`<p>Faça o simulado sem consultar as aulas. Depois, use os erros como mapa de revisão.</p><div class="tip">Meta recomendada: 80% ou mais. Abaixo disso, volte às aulas correspondentes e refaça os exercícios.</div>`]
];

function updateProgress(){let p=Math.round(state.done.length/lessons.length*100);document.getElementById("progressFill").style.width=p+"%";document.getElementById("progressText").textContent=`${p}% concluído • ${state.done.length}/${lessons.length} aulas`}
function buildNav(){let n=document.getElementById("nav");n.innerHTML="";lessons.forEach((l,i)=>{let b=document.createElement("button");b.className="navbtn";b.dataset.title=(l[1]+" "+l[0]).toLowerCase();b.onclick=()=>showLesson(i);b.innerHTML=`${state.done.includes(i)?"✅":"○"} ${l[1]} <span class="tag">${l[0]}</span>`;n.appendChild(b)})}
function filterNav(){let q=document.getElementById("search").value.toLowerCase();document.querySelectorAll("#nav .navbtn").forEach(b=>b.style.display=b.dataset.title.includes(q)?"block":"none")}
function showDashboard(){document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));document.getElementById("app").innerHTML=`
<section class="hero"><h1>Matemática do 7º Ano</h1><p>Uma trilha completa para consolidar números racionais, álgebra, proporcionalidade, geometria, medidas, estatística e probabilidade.</p><div class="badges"><span class="badge">32 aulas</span><span class="badge">BNCC</span><span class="badge">Quiz automático</span><span class="badge">Offline</span></div></section>
<div class="grid"><div class="card stat"><b>${lessons.length}</b><small>Aulas estruturadas</small></div><div class="card stat"><b>${questions.length}</b><small>Questões no simulado</small></div><div class="card stat"><b>${state.score}</b><small>Acertos registrados</small></div></div>
<div class="card"><h2>🧭 Como estudar</h2><ol><li>Avance em ordem, começando pela Aula 01.</li><li>Faça os exemplos no papel.</li><li>Resolva a prática rápida antes de concluir.</li><li>Registre seus erros e volte às aulas correspondentes.</li><li>Finalize com o simulado.</li></ol><div class="actions"><button class="btn" onclick="showLesson(0)">▶ Começar Aula 01</button><button class="btn secondary" onclick="showQuiz()">📝 Simulado</button></div></div>
<div class="card"><h2>🗂️ Mapa do curso</h2>${["Números","Álgebra","Geometria","Grandezas","Probabilidade e Estatística"].map(x=>`<p>• <b>${x}</b> — ${lessons.filter(l=>l[0]===x).length} aulas</p>`).join("")}</div>
<div class="card"><h2>🎯 Meta</h2><p>Busque <b>80% ou mais</b> no simulado final. Abaixo disso, revise as aulas relacionadas aos erros.</p></div>`}
function lessonQuestion(i){let q=bank[i%bank.length];return `<div class="q">${q[0]}</div><div class="options">${["A","B","C","D"].map((x,k)=>`<button onclick="answer(this,'${q[5]}','${x}',${i})"><b>${x})</b> ${q[k+1]}</button>`).join("")}</div><div class="feedback" id="fb${i}"></div>`}
function showLesson(i){let l=lessons[i];document.querySelectorAll("#nav .navbtn").forEach((b,j)=>b.classList.toggle("active",j===i));document.getElementById("app").innerHTML=`<div class="card"><div class="lesson-head"><div><div class="lesson-number">${l[0]} • AULA ${i+1} DE ${lessons.length}</div><h1>${l[1]}</h1></div><span class="badge">${l[3]}</span></div><div class="objective"><b>🎯 Objetivo:</b> ${l[2]}</div>${l[4]}<div class="exercise"><h3>🧠 Prática rápida</h3>${lessonQuestion(i)}</div><div class="actions"><button class="btn success" onclick="completeLesson(${i})">${state.done.includes(i)?"✓ Aula concluída":"✓ Marcar aula como concluída"}</button>${i<lessons.length-1?`<button class="btn secondary" onclick="showLesson(${i+1})">Próxima aula →</button>`:`<button class="btn" onclick="showQuiz()">Abrir simulado →</button>`}</div></div>`}
function answer(btn,correct,chosen,i){let box=btn.parentElement;[...box.children].forEach(b=>b.disabled=true);let ok=chosen===correct;btn.classList.add(ok?"correct":"wrong");document.getElementById("fb"+i).textContent=ok?"✅ Correto! Excelente.":`❌ Ainda não. A resposta correta é ${correct}.`;state.attempts++;if(ok)state.score++;save();showToast(ok?"Resposta correta!":"Revise o conteúdo.")}
function completeLesson(i){if(!state.done.includes(i)){state.done.push(i);save();buildNav();showToast("Aula concluída e progresso salvo!")}showLesson(i)}
function showQuiz(){document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));let qs=questions.map((q,i)=>`<div class="exercise"><div class="q">${i+1}. ${q[1]}</div><div class="options">${["A","B","C","D"].map((x,k)=>`<button onclick="quizAnswer(this,'${q[6]}','${x}',${i})"><b>${x})</b> ${q[k+2]}</button>`).join("")}</div><div class="feedback" id="qfb${i}"></div></div>`).join("");document.getElementById("app").innerHTML=`<section class="hero"><h1>📝 Simulado Final do 7º Ano</h1><p>${questions.length} questões abrangendo todo o curso.</p></section><div class="card">${qs}<div class="actions"><button class="btn" onclick="finishQuiz()">📊 Ver resultado</button></div><div id="quizResult"></div></div>`;window.quizHits=0;window.quizAnswered=0}
function quizAnswer(btn,correct,chosen,i){let box=btn.parentElement;if(box.dataset.done)return;box.dataset.done=1;[...box.children].forEach(b=>b.disabled=true);window.quizAnswered++;if(chosen===correct){btn.classList.add("correct");window.quizHits++;document.getElementById("qfb"+i).textContent="✅ Correto"}else{btn.classList.add("wrong");document.getElementById("qfb"+i).textContent=`❌ Correta: ${correct}`}}
function finishQuiz(){let a=window.quizAnswered||0,h=window.quizHits||0,p=a?Math.round(h/a*100):0;document.getElementById("quizResult").innerHTML=`<div class="objective"><h2>Resultado: ${h}/${a} • ${p}%</h2>${a<questions.length?"⚠️ Responda todas as questões para uma avaliação completa.":p>=80?"🎉 Excelente! Seu desempenho indica boa preparação para o 8º ano.":"📚 Revise as aulas correspondentes aos erros e refaça o simulado."}</div>`;state.score+=h;save()}
function resetProgress(){if(confirm("Apagar todo o progresso do curso?")){state.done=[];state.score=0;state.attempts=0;save();buildNav();showDashboard()}}
function showToast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
buildNav();updateProgress();showDashboard();
</script>
</body>
</html>
